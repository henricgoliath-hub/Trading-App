<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Trading Signals</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1120;
color:#f8fafc;
}

.container{
max-width:1050px;
margin:auto;
padding:25px 18px 45px;
}

header{
text-align:center;
padding:20px 0 30px;
}

header h1{
margin:0;
font-size:32px;
}

header p{
color:#94a3b8;
}

.status{
display:inline-block;
padding:7px 12px;
border-radius:20px;
background:#132e22;
color:#4ade80;
font-size:13px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
gap:18px;
}

.card,.panel{
background:#111827;
border:1px solid #243044;
border-radius:18px;
padding:22px;
}

.pair{
font-size:22px;
font-weight:bold;
}

.market{
color:#64748b;
font-size:12px;
margin-top:5px;
}

.signal-box{
margin-top:20px;
padding:18px;
border-radius:14px;
background:#0b1220;
text-align:center;
}

.label{
color:#94a3b8;
font-size:12px;
text-transform:uppercase;
letter-spacing:1px;
}

.signal{
font-size:28px;
font-weight:bold;
margin-top:7px;
}

.buy{color:#22c55e}
.sell{color:#ef4444}
.wait{color:#facc15}

.price{
margin-top:18px;
color:#cbd5e1;
}

.strategy{
margin-top:9px;
color:#94a3b8;
font-size:13px;
}

button{
display:block;
margin:25px auto;
padding:14px 25px;
border:0;
border-radius:12px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.section{
margin-top:38px;
}

.</html>
